name: iOS

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Select simulator
        run: |
          simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next(d["udid"] for devices in data["devices"].values() for d in devices if d["name"].startswith("iPhone")))')
          echo "SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
      - name: Build and test
        run: >-
          xcodebuild test
          -project Spectrogram.xcodeproj
          -scheme Spectrogram
          -destination "id=$SIMULATOR_ID"
          -derivedDataPath "$RUNNER_TEMP/SpectrogramDerivedData"
          CODE_SIGNING_ALLOWED=NO
